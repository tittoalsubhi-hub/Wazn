name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Stable debug signing (optional secret)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using stable debug keystore from secrets"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; debug APKs from different runs cannot update each other"
          fi

      - name: Source, resource and privacy checks
        run: |
          python3 scripts/check_project.py
          git diff --check HEAD~1 HEAD || git diff --check

      - name: Financial engine, data tests, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :core:domain:test \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :core:data:assembleDebugAndroidTest \
            --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator tests (serial, one emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-parallel --max-workers=1 --stacktrace

      - name: APK checksum and build info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          sha256sum "$APK" > "$APK.sha256"
          { echo "commit=$GITHUB_SHA"; echo "run=$GITHUB_RUN_NUMBER"; echo "schema=$(ls core/data/schemas/*/ 2>/dev/null | tr '\n' ' ')"; } > app/build/outputs/apk/debug/build-info.txt
          cat "$APK.sha256"

      # The APK is uploaded only when every previous step passed.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudgetSMS-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/build-info.txt

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: core/data/schemas/

      # Diagnostics are always uploaded (no personal data: tests use synthetic fixtures only).
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
